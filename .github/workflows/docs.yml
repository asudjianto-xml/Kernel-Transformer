name: docs
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[docs]
      - run: cd docs && make html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/build/html/
