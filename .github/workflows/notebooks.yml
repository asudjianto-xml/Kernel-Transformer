name: notebooks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev,benchmarks]
      - name: Validate all notebooks run end-to-end
        run: |
          for nb in notebooks/*.ipynb; do
            echo "Validating $nb"
            papermill "$nb" /tmp/output.ipynb -k python3
          done
